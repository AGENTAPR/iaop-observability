# OpenTelemetry Collector configuration for IAOP local development.
# Mounted by iaop-local-dev/docker-compose.yml (profile: observability).
#
# Receives OTLP (gRPC 4317 / HTTP 4318) from all IAOP services,
# exposes Prometheus metrics on :8889, and logs to stdout.
# Production deployments should add an exporter backend (e.g. OTLP to a
# managed collector, Jaeger/Tempo for traces) — see docs/.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]
